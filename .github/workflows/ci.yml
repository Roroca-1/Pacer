name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ g++-multilib make libvulkan-dev libxcb1-dev \
            python3 python3-pip libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python3 -m pip install --user --break-system-packages PySide6

      - name: Build (x86_64 + i386)
        run: make all

      - name: Test
        run: make test

      - name: Staged install
        run: PREFIX=/usr DESTDIR=$PWD/build/stage ./install.sh && ls -R build/stage/usr | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: pacer-gui-screenshot
          path: build/guitest/shot.png
          if-no-files-found: ignore
